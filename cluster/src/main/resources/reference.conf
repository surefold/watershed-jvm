# What a node of the cluster reads. Every value here can be given in an application.conf, as a system property
# (-Dwatershed.job.lot=2500) or, where one is named, from the environment.
watershed {
  # How this node joins the cluster: read by Surefold's own surefold-app-cluster.
  cluster {
    node {
      name = "node"
      name = ${?WATERSHED_NAME}
      host = "127.0.0.1"
      host = ${?WATERSHED_HOST}
      port = 25520
      port = ${?WATERSHED_PORT}
    }
    join = "static"
    static.seeds = ["127.0.0.1:25520"]
    # What the node does: "worker" runs lots, "coordinator" may run the coordinator.
    roles = []
    # Nodes of a batch job come and go by being stopped; one gone quiet is given up on after this long.
    downing.stableAfter = 10s
    leaveWithin = 5s
    whenDowned = exit
  }

  # The S3-compatible bucket a job's files are in. An empty endpoint is AWS itself.
  bucket {
    name = ""
    name = ${?WATERSHED_BUCKET}
    region = "auto"
    endpoint = ""
    endpoint = ${?WATERSHED_S3_ENDPOINT}
    path-style = false
    access-key = ""
    access-key = ${?WATERSHED_S3_ACCESS_KEY}
    secret-key = ""
    secret-key = ${?WATERSHED_S3_SECRET_KEY}
    # Make the bucket if it is not there: for a store started for one run.
    create = false
  }

  worker {
    # true to need a GPU, false to use the CPU, auto to use a GPU if there is one.
    gpu = "auto"
    # How many bytes of the GPU's memory to use, for a worker that shares its GPU; 0 for four fifths of what is free.
    gpu-bytes = 0
  }

  patience {
    lot-within = 30m
    attempts = 3
    tell-again-every = 5s
    ask-every = 1s
    settled = 5s
  }

  # The job `submit` runs. plan, inputs, check, patch and check-after name files in the bucket.
  job {
    id = "job"
    plan = ""
    inputs = ""
    inputs-per = 0
    outputs-per = 0
    lot = 0
    out = "out"
    # Which of the plan's outputs to write as answers; all of them if empty.
    columns = []
    # Whether each lot holds on to what it ran, to be brought up to date with `patch`.
    hold = false
    # How many workers to wait for, and for how long, before starting.
    workers = 1
    wait = 2m
    within = 10h
    # Files of the answers expected, to compare with, to the last bit; and a patch to bring a held run up to date.
    check = ""
    patch = ""
    check-after = ""
  }

  # The file `put` copies into the bucket.
  put {
    from = ""
    key = ""
  }
}
