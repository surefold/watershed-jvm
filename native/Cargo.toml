[package]
name = "watershed-jvm"
version = "0.1.0"
publish = false
description = "The watershed engine as a C library for the JVM, called from Kotlin and Scala"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "watershed_jvm"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# The engine, at a commit of its own repository. Move `rev` forward to take
# a newer engine (and run `sbt test`).
watershed-core = { git = "https://github.com/surefold/watershed", rev = "355bc1d40c89b5b5b02dab77b59a12ff0541b57c" }
# Plans: the graph run for many sets of inputs at once. With `cuda`, on an
# NVIDIA GPU too; the CUDA libraries are found when a GPU is first asked for.
watershed-gpu = { git = "https://github.com/surefold/watershed", rev = "355bc1d40c89b5b5b02dab77b59a12ff0541b57c" }

[features]
cuda = ["watershed-gpu/cuda"]

# A C library has to read what it is pointed at, so unsafe code is allowed
# here. All of it is in src/ffi.rs.
[lints.clippy]
all = { level = "warn", priority = -1 }
