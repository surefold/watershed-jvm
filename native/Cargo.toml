[package]
name = "watershed-jvm"
version = "0.1.0"
publish = false
description = "The watershed engine as a C library for the JVM, called from Kotlin and Scala"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "watershed_jvm"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# The engine, at a commit of its own repository. Move `rev` forward to take
# a newer engine (and run `sbt test`).
watershed-core = { git = "https://github.com/surefold/watershed", rev = "47f37ca0a8d053680715151fa94f87e2f5152b3b" }
# Plans: the graph run for many sets of inputs at once. With `cuda`, on an
# NVIDIA GPU too; the CUDA libraries are found when a GPU is first asked for.
watershed-gpu = { git = "https://github.com/surefold/watershed", rev = "47f37ca0a8d053680715151fa94f87e2f5152b3b" }

[features]
# Built against CUDA 13.1 (NVIDIA driver 580 or later), or with cuda-12 in its
# place against CUDA 12.8 (driver 570 or later). Not both.
cuda = ["gpu", "watershed-gpu/cuda"]
cuda-12 = ["gpu", "watershed-gpu/cuda-12"]
# What the code asks: is there a GPU side at all.
gpu = []

# A C library has to read what it is pointed at, so unsafe code is allowed
# here. All of it is in src/ffi.rs.
[lints.clippy]
all = { level = "warn", priority = -1 }
